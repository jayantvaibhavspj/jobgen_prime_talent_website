<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <!-- ICONIC ISOMETRIC CLOUD INFRASTRUCTURE (CLEAN, MINIMAL, NO NOISE) -->
  <g id="cloud-isometric" transform="translate(980, 120)">
    <!-- Top Compute Plane -->
    <polygon points="200,40 360,110 200,180 40,110" 
             fill="#0369a1" fill-opacity="0.15" 
             stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.45"/>
    <circle cx="200" cy="110" r="10" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="200" cy="110" r="22" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.6"/>

    <!-- Pillar Interlinks -->
    <line x1="40" y1="110" x2="40" y2="230" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="360" y1="110" x2="360" y2="230" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="200" y1="180" x2="200" y2="300" stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.5"/>

    <!-- Middle Network & Gateway Plane -->
    <polygon points="200,160 360,230 200,300 40,230" 
             fill="#0369a1" fill-opacity="0.15" 
             stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.45"/>
    <circle cx="120" cy="230" r="6" fill="#00f0ff" fill-opacity="0.8"/>
    <circle cx="280" cy="230" r="6" fill="#38bdf8" fill-opacity="0.8"/>
    <line x1="120" y1="230" x2="280" y2="230" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.5"/>

    <!-- Lower Pillar Interlinks -->
    <line x1="40" y1="230" x2="40" y2="350" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="360" y1="230" x2="360" y2="350" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="200" y1="300" x2="200" y2="420" stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.5"/>

    <!-- Base Storage & Data Lake Plane -->
    <polygon points="200,280 360,350 200,420 40,350" 
             fill="#0369a1" fill-opacity="0.15" 
             stroke="#f59e0b" stroke-width="2.2" stroke-opacity="0.45"/>
    <circle cx="200" cy="350" r="8" fill="#00f0ff" fill-opacity="0.8"/>

    <!-- Ambient Orbital Aura -->
    <ellipse cx="200" cy="230" rx="220" ry="110" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  </g>
</svg>