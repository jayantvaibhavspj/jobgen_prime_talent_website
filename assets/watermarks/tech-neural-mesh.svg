<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <defs>
    <radialGradient id="neuralGlow" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#neuralGlow)"/>

  <!-- AI Neural Network Nodes & Synapse Links (NO TEXT) -->
  <g stroke-linecap="round">
    <line x1="880" y1="180" x2="1020" y2="120" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1020" y1="120" x2="1180" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1180" y1="160" x2="1320" y2="110" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25"/>
    <line x1="880" y1="180" x2="940" y2="300" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="1020" y1="120" x2="1100" y2="260" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="1180" y1="160" x2="1100" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="1180" y1="160" x2="1280" y2="280" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1320" y1="110" x2="1280" y2="280" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25"/>
    <line x1="940" y1="300" x2="1100" y2="260" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1100" y1="260" x2="1280" y2="280" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.45"/>
    <line x1="940" y1="300" x2="1010" y2="440" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="1100" y1="260" x2="1170" y2="410" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="1280" y1="280" x2="1170" y2="410" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1010" y1="440" x2="1170" y2="410" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1170" y1="410" x2="1320" y2="460" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="1280" y1="280" x2="1320" y2="460" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25"/>

    <line x1="140" y1="240" x2="260" y2="180" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25"/>
    <line x1="260" y1="180" x2="380" y2="250" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="140" y1="240" x2="200" y2="380" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.25"/>
    <line x1="260" y1="180" x2="200" y2="380" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.2"/>
    <line x1="380" y1="250" x2="200" y2="380" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="200" y1="380" x2="320" y2="480" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.25"/>
    <line x1="380" y1="250" x2="320" y2="480" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>

    <!-- Nodes with glow rings & pulse -->
    <circle cx="880" cy="180" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
    <circle cx="1020" cy="120" r="7" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="1020" cy="120" r="14" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="1180" cy="160" r="6" fill="#0ea5e9" fill-opacity="0.7"/>
    <circle cx="1320" cy="110" r="4.5" fill="#38bdf8" fill-opacity="0.6"/>
    <circle cx="940" cy="300" r="6" fill="#0ea5e9" fill-opacity="0.7"/>

    <!-- Central Super-Node (Amber AI Hub) -->
    <circle cx="1100" cy="260" r="10" fill="#f59e0b" fill-opacity="0.9">
      <animate attributeName="r" values="8;13;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="260" r="22" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="1100" cy="260" r="32" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>

    <circle cx="1280" cy="280" r="7" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="1010" cy="440" r="5" fill="#0ea5e9" fill-opacity="0.7"/>
    <circle cx="1170" cy="410" r="8" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="1170" cy="410" r="16" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="1320" cy="460" r="5" fill="#f59e0b" fill-opacity="0.7"/>

    <circle cx="140" cy="240" r="4" fill="#0ea5e9" fill-opacity="0.6"/>
    <circle cx="260" cy="180" r="6" fill="#38bdf8" fill-opacity="0.7"/>
    <circle cx="380" cy="250" r="7" fill="#f59e0b" fill-opacity="0.7"/>
    <circle cx="200" cy="380" r="5" fill="#0ea5e9" fill-opacity="0.6"/>
    <circle cx="320" cy="480" r="4" fill="#f59e0b" fill-opacity="0.6"/>
  </g>
</svg>