<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <defs>
    <pattern id="subgrid_dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="mainGrid_dark" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#subgrid_dark)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.09"/>
      <!-- Crosshairs -->
      <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="2" fill="#38bdf8" fill-opacity="0.6"/>
    </pattern>
    <radialGradient id="cyanCore" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberCore" cx="20%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glows -->
  <rect width="1440" height="900" fill="url(#cyanCore)"/>
  <rect width="1440" height="900" fill="url(#amberCore)"/>

  <!-- Matrix Grid -->
  <rect width="1440" height="900" fill="url(#mainGrid_dark)"/>

  <!-- HUD Reticles & Geometric Brackets (NO TEXT) -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <!-- Top-Right Radar Ring -->
    <circle cx="1240" cy="180" r="110" stroke-dasharray="6 8" stroke-opacity="0.3"/>
    <circle cx="1240" cy="180" r="60" stroke-opacity="0.5"/>
    <circle cx="1240" cy="180" r="6" fill="#38bdf8" fill-opacity="0.7">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="1110" y1="180" x2="1370" y2="180" stroke-opacity="0.3"/>
    <line x1="1240" y1="50" x2="1240" y2="310" stroke-opacity="0.3"/>

    <!-- Corner Framing Brackets -->
    <path d="M 60 70 L 35 70 L 35 110" stroke-width="2"/>
    <path d="M 1380 70 L 1405 70 L 1405 110" stroke-width="2"/>
    <path d="M 35 790 L 35 830 L 60 830" stroke-width="2"/>
    <path d="M 1405 790 L 1405 830 L 1380 830" stroke-width="2"/>
  </g>

  <!-- Geometric Circuit Node Cluster (NO TEXT) -->
  <g stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <polygon points="120,480 150,463 180,480 180,515 150,532 120,515"/>
    <circle cx="150" cy="497" r="4" fill="#f59e0b" fill-opacity="0.8">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="180" y1="497" x2="320" y2="497" stroke-dasharray="4 4"/>
    <circle cx="320" cy="497" r="3" fill="#f59e0b" fill-opacity="0.6"/>
  </g>
</svg>