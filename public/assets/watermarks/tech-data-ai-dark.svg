<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <!-- ICONIC NEURAL ORBITAL CORE (CLEAN, SOPHISTICATED) -->
  <g id="ai-neural-core" transform="translate(1080, 160)">
    <!-- Central AI Nucleus Core -->
    <circle cx="150" cy="150" r="22" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="150" cy="150" r="42" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="8 6" stroke-opacity="0.48"/>
    <circle cx="150" cy="150" r="62" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.4"/>

    <!-- Orbital Trajectory 1 -->
    <ellipse cx="150" cy="150" rx="160" ry="60" transform="rotate(-30 150 150)" 
             stroke="#00f0ff" stroke-width="2.2" stroke-opacity="0.48"/>
    <circle cx="280" cy="80" r="8" fill="#00f0ff" fill-opacity="0.85"/>
    <circle cx="20" cy="220" r="7" fill="#38bdf8" fill-opacity="0.85"/>

    <!-- Orbital Trajectory 2 -->
    <ellipse cx="150" cy="150" rx="160" ry="60" transform="rotate(45 150 150)" 
             stroke="#a855f7" stroke-width="2.2" stroke-opacity="0.48"/>
    <circle cx="260" cy="260" r="8" fill="#a855f7" fill-opacity="0.85"/>
    <circle cx="40" cy="40" r="7" fill="#f59e0b" fill-opacity="0.85"/>

    <!-- Crosshair Telemetry Vectors -->
    <line x1="150" y1="60" x2="150" y2="240" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <line x1="60" y1="150" x2="240" y2="150" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  </g>
</svg>